name: Site CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verificar JavaScript
        run: |
          node --check script.js
          node --check demo.js

      - name: Verificar sitio
        run: node --test tests/site.test.mjs
